<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let n = parseInt (prompt("enter a size of n :"))
      let arr=[]
      for(i=0;i<n;i++){
        arr[i]= parseInt (prompt("enter a size of arr :"))
      }
       let max=arr[0];
       let min = arr[0];
       for(i=0;i<n;i++){
        if(max<arr[i]){
            max=arr[i];
        }
        if(min>arr[i]){
            min=arr[i]
        }
       }
       console.log(arr);
       console.log("max_arr: "+max)
        console.log("min_arr: "+min)
        

    </script>
</body>
</html>
