<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let n = parseInt (prompt("enter a size of n :"))
      let a=[]
      let temp,i,j;
      for(i=0;i<n;i++){
        a[i]= parseInt (prompt("enter a element of arr :"))
      }
      for(i=0;i<n-1;i++){
        for(j=0;j<n-i-1;j++){
            if(a[j]>a[j+1]){
                temp = a[j]
                a[j] = a[j+1]
                a[j+1] = temp
            }
        }
      }
       console.log(a);
    </script>
</body>
</html>
