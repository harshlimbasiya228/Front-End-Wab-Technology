<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let a = [10,20,30,40,50]
        let b = [1,2,65,78]
        n = a.length+b.length;
        let c = [n]
        for(i=0;i<a.length;i++){
            c[i]=a[i]
        }
        for(i=a.length;i<n;i++){
            c[i]=b[i-a.length]
        }
        document.write(c+" ")
    </script>
</body>
</html>
