<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <style>
    body {
      font-family:
        "Segoe UI",
        system-ui,
        -apple-system,
        sans-serif;
      background: linear-gradient(135deg, #e0e7ff 0%, #f3f4f6 100%);
      min-height: 100vh;
      color: #1e293b;
      margin: 0;
      padding: 40px 20px;
    }
    h2 {
      text-align: center;
      color: #0f172a;
      font-size: 32px;
      margin-bottom: 30px;
      font-weight: 700;
      text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.05);
    }
    .container {
      display: flex;
      gap: 25px;
      max-width: 1000px;
      margin: 0 auto;
    }
    .card {
      background-color: #ffffff;
      border-radius: 12px;
      box-shadow:
        0 10px 15px -3px rgba(0, 0, 0, 0.07),
        0 4px 6px -2px rgba(0, 0, 0, 0.04);
      border: none;
      padding: 24px;
    }
    .left-side {
      width: 65%;
    }

    .right-side {
      width: 35%;
      height: fit-content;
      position: sticky;
      top: 40px;
    }

    h3 {
      margin-top: 0;
      font-size: 18px;
      color: #334155;
      border-bottom: 2px solid #f1f5f9;
      padding-bottom: 12px;
      margin-bottom: 16px;
    }
    p.subtitle {
      color: #64748b;
      font-size: 14px;
      margin-bottom: 20px;
    }
    .table {
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 24px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background-color: #ffffff;
    }

    th {
      background-color: #f8fafc;
      color: #475569;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 14px 16px;
      text-align: left;
      border-bottom: 2px solid #cbd5e1;
    }

    td {
      padding: 14px 16px;
      border-bottom: 1px solid #e2e8f0;
      color: #334155;
      font-weight: 500;
      transition: all 0.2s ease;
    }
    tbody tr:hover {
      background-color: #eff6ff !important;
    }
    input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: #10b981;
    }
    .b-group {
      display: flex;
      gap: 12px;
    }

    button {
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 600;
      border: none;
      border-radius: 6px;
    }
    .b-update {
      background-color: #e0f2fe;
      color: #0284c7;
    }
    .b-update:hover {
      background-color: #bae6fd;
    }

    .b-clear {
      background-color: #fee2e2;
      color: #dc2626;
    }
    .b-clear:hover {
      background-color: #fecaca;
    }

    .b-submit {
      background-color: #2bd89f;
      color: white;
      box-shadow: 0 4px 6px rgba(16, 185, 129, 0.2);
      margin-left: auto;
    }
    .b-submit:hover {
      background-color: #0ee29c;
    }
    #absentList {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    #absentList li {
      background-color: #fef2f2;
      border: 1px solid #fecaca;
      color: #b91c1c;
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 10px;
      font-size: 14px;
      font-weight: 600;
    }
    .success-msg {
      background-color: #ecfdf5 !important;
      border: 1px solid #a7f3d0 !important;
      color: #047857 !important;
    }
  </style>
  <body>
    <h2>Attendance Dashboard</h2>
    <div class="container">
      <div class="card left-side">
        <p class="subtitle">Check the box if present. Uncheck if absent.</p>
        <div class="table">
          <table>
            <thead>
              <tr>
                <th width="20%">Roll No</th>
                <th width="50%">Student Name</th>
                <th width="30%">Status</th>
              </tr>
            </thead>
            <tbody id="tb"></tbody>
          </table>
        </div>

        <div class="btn-group">
          <button class="b-update" onclick="resetAll()">
            Reset (Mark All Present)
          </button>
          <button class="b-clear" onclick="clearAll()">Mark All Absent</button>
          <button class="b-submit" onclick="submitAttendance()">
            Submit Today's Attendance
          </button>
        </div>
      </div>

      <div class="card right-side">
        <h3 style="color: #ef4444; border-bottom-color: #fee2e2">
          Absent Students
        </h3>
        <ul id="absentList"></ul>
      </div>
    </div>
    <script>
      let student = [
        { roll: 1, name: "virat" },
        { roll: 2, name: "rohit" },
        { roll: 3, name: "Priya " },
        { roll: 4, name: "Neha " },
        { roll: 5, name: "Rohan " },
        { roll: 6, name: "Sneha " },
        { roll: 7, name: "Vikram " },
        { roll: 8, name: "Anjali " },
        { roll: 9, name: "Karan " },
        { roll: 10, name: "Pooja " },
        { roll: 11, name: "Arjun " },
        { roll: 12, name: "Kavya " },
        { roll: 13, name: "Manish " },
        { roll: 14, name: "Nisha " },
        { roll: 15, name: "Suresh " },
        { roll: 16, name: "Riya " },
        { roll: 17, name: "Deepak " },
        { roll: 18, name: "Sunita " },
        { roll: 19, name: "Gaurav " },
        { roll: 20, name: "Meera " },
      ];

      function entrytable() {
        let table = document.getElementById("tb");
        for (let i = 0; i < student.length; i++) {
          let enter = `
            <tr>
                <td>
                    <span class="roll-tag">${student[i].roll}</span>
                </td>
                <td>${student[i].name}</td>
                        <td>
                            <input type="checkbox" class="student-checkbox" checked 
                                   data-roll="${student[i].roll}" 
                                   data-name="${student[i].name}"
                                   onchange="updateSidebar()"> 
                        </td>
            </tr>
            `;
          table.innerHTML += enter;
        }

        updateSidebar();
      }
      function updateSidebar() {
        let checktick = document.getElementsByClassName("student-checkbox");
        let absentBox = document.getElementById("absentList");
        absentBox.innerHTML = "";
        let count = 0;
        for (i = 0; i < checktick.length; i++) {
          if (checktick[i].checked === false) {
            let rollno = checktick[i].getAttribute("data-roll");
            let name = checktick[i].getAttribute("data-name");

            absentBox.innerHTML += `<li>${rollno} - ${name}</li>`;
            count++;
          }
        }
        if (count === 0) {
          absentBox.innerHTML =
            "<li class='success-msg'> Everyone is present today!</li>";
        }
      }

      function resetAll() {
        let checktick = document.getElementsByClassName("student-checkbox");
        for (let i = 0; i < checktick.length; i++) {
          checktick[i].checked = true;
        }
        updateSidebar();
      }
      function clearAll() {
        let checktick = document.getElementsByClassName("student-checkbox");
        for (let i = 0; i < checktick.length; i++) {
          checktick[i].checked = false;
        }
        updateSidebar();
      }
      function submitAttendance() {
        let checktick = document.getElementsByClassName("student-checkbox");
        let pre_count = 0;
        let abs_count = 0;

        for (let i = 0; i < checktick.length; i++) {
          if (checktick[i].checked === true) {
            pre_count++;
          } else {
            abs_count++;
          }
        }
        alert(
          "Attendance Saved Successfully!\n\nTotal Present: " +
            pre_count +
            "\nTotal Absent: " +
            abs_count,
        );
      }
      window.onload = entrytable;
    </script>
  </body>
</html>
