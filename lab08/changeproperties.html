<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id="p1">Lorem ipsum, dolor sit amet consectetur adipisicing elit. Est doloremque at, labore nulla delectus inventore quam quas. Labore iste veritatis commodi blanditiis ducimus.</p>
    <script>
        pera=document.getElementById("p1")
        pera.addEventListener("click",function(){
            p1.style.color="blue"
        })
        pera.addEventListener("mouseover",function(){
            p1.style.color="orange"

        })
        pera.addEventListener("click",function(){
            p1.innerHTML="Lorem ipsum, dolor sit amet consectetur adipisicing elit."
        })
        pera.addEventListener("mouseover",function(){
           p1.innerHTML="<h1>hellow</h1><p>Harsh Limbasiya</p>"

        })
    </script>
</body>
</html>
