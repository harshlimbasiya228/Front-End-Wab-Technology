<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let n = parseInt (prompt("enter a value of n :"))
        let orignal = n
        let result=0
        while(n>0){
            let digit = n%10
            result=result*10+digit
            n=parseInt (n/10)
        }
       if(orignal==result){
        document.write("number is palindrom")
       }else{
        document.write("not palindrom")
       }
    </script>
</body>
