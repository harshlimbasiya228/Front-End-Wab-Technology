<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let n = parseInt (prompt("enter a number n :"))
        let count=0
        for(let i=1;i<=n;i++){
            if(n%i==0){
                count++
            }
        }
        if(count==2){
            alert(n+" number is prime")
        }else{
            alert("not prime number")
        }
    </script>
</body>
</html>
